header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:rgba(6,16,44,.8);backdrop-filter:blur(4px)}
header h1{font-size:18px;margin:0;flex:1}select,button,input,textarea{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #3a4560;background:#273047;color:#e8ecf3}
button{cursor:pointer}button:hover{background:#34405e}button.p{background:#2f7d4f;border-color:#2f7d4f}button.r{background:#a33}
main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,600px);gap:12px;padding:12px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:rgba(14,24,52,.84);backdrop-filter:blur(3px);border-radius:10px;padding:12px;margin-bottom:12px}.card h3{margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:4px 6px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}
tr.q{background:#24533a}tr.x{background:#3a3f4d}th{color:#9fb0d0;font-weight:500}
.m{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 0;border-top:1px solid #34405e;font-size:14px}.m.me{font-weight:600}
.m small{color:#9fb0d0}.board{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,560px);aspect-ratio:1;margin:8px auto;border:4px solid #5a3a1e}
.sq{position:relative;display:flex;align-items:center;justify-content:center}.sq.l{background:#f0d9b5}.sq.d{background:#b58863}
.sq.sel{background:#e6c84a}.sq.lm{background:#c9b04a}.sq.ms{background:#d33}
.sq.tg::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(40,160,80,.8);position:absolute}
.pc{width:80%;height:80%;border-radius:50%;box-shadow:0 2px 4px #0008;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,4vw,28px)}
.pc.w{background:radial-gradient(#fff,#ddd 60%,#aaa);color:#a80}.pc.b{background:radial-gradient(#666,#222 60%,#000);color:#fc3}
.pc.k::after{content:"♛"}.pc.tk{opacity:.35}
.pl{padding:6px 10px;border-radius:6px;background:#1d2330;text-align:center}.pl.on{outline:2px solid #4c9;}
.warn{background:#7a2230;padding:8px;border-radius:6px;margin:6px 0;text-align:center}
#admin{display:none}#admin textarea{width:100%;height:110px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.badge{font-size:12px;padding:3px 8px;border-radius:10px;background:#444}

/* ====== MA'LUMOTLAR QATLAMI ====== */
let S = {league:{},games:{},presence:{},invites:{},links:{},owners:{}};

/* ====== SHASHKA MOTORI ====== */
const D=[[1,1],[1,-1],[-1,1],[-1,-1]], inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8, isDark=(r,c)=>(r+c)%2===1;
const other=s=>s==='w'?'b':'w';
const initBoard=()=>{let b='';for(let r=0;r<8;r++)for(let c=0;c<8;c++)b+=!isDark(r,c)?'.':r<3?'b':r>4?'w':'.';return b;};
function jumps(B,i,taken){ // bitta urish qadamlari (orqaga ham, damka uchun uzoq masofaga)
  const r=i>>3,c=i&7,p=B[i],me=p.toLowerCase(),king=p!==me,out=[];
  for(const [dr,dc] of D){
    if(!king){const r1=r+dr,c1=c+dc,r2=r+2*dr,c2=c+2*dc;
      if(inb(r2,c2)){const q=B[r1*8+c1];if(q!=='.'&&q.toLowerCase()!==me&&!taken.has(r1*8+c1)&&B[r2*8+c2]==='.')out.push({to:r2*8+c2,cap:r1*8+c1,kind:'j'});}
    }else{
      let r1=r+dr,c1=c+dc;while(inb(r1,c1)&&B[r1*8+c1]==='.'){r1+=dr;c1+=dc;}
      if(!inb(r1,c1))continue;const q=B[r1*8+c1];if(q.toLowerCase()===me||taken.has(r1*8+c1))continue;
      let r2=r1+dr,c2=c1+dc;while(inb(r2,c2)&&B[r2*8+c2]==='.'){out.push({to:r2*8+c2,cap:r1*8+c1,kind:'j'});r2+=dr;c2+=dc;}
    }
  }
  return out;
}
function steps(B,i){
  const r=i>>3,c=i&7,p=B[i],me=p.toLowerCase(),king=p!==me,out=[];
  for(const [dr,dc] of D){if(!king&&dr!==(me==='w'?-1:1))continue;
    let r1=r+dr,c1=c+dc;while(inb(r1,c1)&&B[r1*8+c1]==='.'){out.push({to:r1*8+c1,cap:-1,kind:'m'});if(!king)break;r1+=dr;c1+=dc;}}
  return out;
}
const mine=(B,s)=>{const a=[];for(let i=0;i<64;i++)if(B[i]!=='.'&&B[i].toLowerCase()===s)a.push(i);return a;};
const capPieces=(B,s)=>mine(B,s).filter(i=>jumps(B,i,new Set()).length);
function evaluate(B,turn){
  const w=mine(B,'w').length,b=mine(B,'b').length;
  if(!w)return{res:'b'};if(!b)return{res:'w'};
  if(w===1&&b===1&&!/[WB]/.test(B))return{res:'d'};           // bittadan oddiy tosh - durrang
  const cm=s=>mine(B,s).some(i=>jumps(B,i,new Set()).length||steps(B,i).length);
  if(!cm(turn))return(mine(B,turn).length<=4&&cm(other(turn)))?{res:other(turn)}:{res:'d'}; // 4 tagacha tosh bilan blok - raqib yutadi, aks holda durrang
  return null;
}
function targets(g,i){
  const B=g.b,taken=new Set(g.taken||[]),ch=g.chain==null?-1:g.chain;
  if(ch>=0)return i===ch?jumps(B,i,taken):[];
  const j=jumps(B,i,taken);return j.length?j:steps(B,i);
}

/* ====== HOLAT ====== */
const LIM=5,DAY=864e5,ONLINE=70e3,INV_TTL=120e3,T0=Date.now(),seen=new Set();
let me=localStorage.getItem('shashka_me')||'',openId=null,sel=null,chipMode=false,botT=null,lastP='',selCls='',isAdmin=localStorage.getItem('shashka_admin')==='1';
const $=id=>document.getElementById(id);
const P=()=>S.league.participants||{},M=()=>S.league.matches||{};
const nm=id=>id==='bot'?'🤖 Robot':P()[id]||'?';
const mySide=m=>m&&me?(m.a===me?'w':m.b===me?'b':null):null;
const newGame=()=>({b:initBoard(),t:'w',chain:-1,taken:[],missed:[],over:false});
const fmt=t=>new Date(t).toLocaleString('uz',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
function used(id){const t=Date.now()-DAY;return Object.values(M()).filter(m=>(m.a===id||m.b===id)&&m.ts>t).map(m=>m.ts).sort((a,b)=>a-b);}
function limitMsg(id){const u=used(id);return u.length<LIM?'':(id===me?"Bugungi 5 ta o'yin tugadi. ":nm(id)+": kunlik 5 ta o'yin tugagan. ")+fmt(u[u.length-LIM]+DAY)+" dan keyin o'ynash mumkin.";}
function commit(id,ng,ev){
  const p={};
  if(ev){ng.over=true;ng.res=ev.res;const cnt=s=>mine(ng.b,s).length;
    p['league/matches/'+id+'/status']='done';
    p['league/matches/'+id+'/result']={w:ev.res==='w'?'a':ev.res==='b'?'b':'d',pa:cnt('w'),pb:cnt('b')};}
  p['games/'+id]=ng;DB.update(p);
}
function apply(g,from,m){
  const B=g.b.split(''),taken=[...(g.taken||[])];let p=B[from];B[from]='.';
  const r2=m.to>>3;if(p==='w'&&r2===0)p='W';if(p==='b'&&r2===7)p='B';B[m.to]=p;
  const ng={...g,missed:[],last:[from,m.to]};
  if(m.kind==='j'){
    taken.push(m.cap);
    if(jumps(B.join(''),m.to,new Set(taken)).length){ng.b=B.join('');ng.taken=taken;ng.chain=m.to;return{ng,ev:null};}
    taken.forEach(t=>B[t]='.');ng.taken=[];ng.chain=-1;
  }else ng.missed=capPieces(g.b,g.t);
  ng.b=B.join('');ng.t=other(g.t);
  return{ng,ev:evaluate(ng.b,ng.t)};
}
function play(id,g,from,m){const r=apply(g,from,m);commit(id,r.ng,r.ev);}
function chipRemove(id,g,i){const B=g.b.split('');B[i]='.';const ng={...g,b:B.join(''),missed:[]};commit(id,ng,evaluate(ng.b,g.t));}
function chippaki(i){chipMode=false;sel=null;chipRemove(openId,S.games[openId],i);}
function resign(){
  if(!confirm("Taslim bo'lasizmi?"))return;
  const g=S.games[openId],s=mySide(M()[openId]);commit(openId,{...g},{res:other(s)});
}
/* ====== ROBOT ====== */
const val=(B,s)=>mine(B,s).reduce((a,i)=>a+(B[i]===B[i].toUpperCase()?3:1),0);
function moves(g){
  const ch=g.chain==null?-1:g.chain,c=[];
  (ch>=0?[ch]:mine(g.b,g.t)).forEach(i=>targets(g,i).forEach(t=>c.push([i,t])));
  const caps=c.filter(x=>x[1].kind==='j');return caps.length?caps:c; // urish majburiy
}
function ab(g,d,a,b){ // bot ('b') nuqtai nazaridan baho
  const ms=moves(g);if(!ms.length)return 0;
  const mx=g.t==='b';let best=mx?-1e9:1e9;
  for(const [i,t] of ms){
    const r=apply(g,i,t);let v;
    if(r.ev)v=r.ev.res==='b'?1e3+d:r.ev.res==='w'?-1e3-d:0;
    else{const nd=r.ng.t===g.t?d:d-1;v=nd<=0?val(r.ng.b,'b')-val(r.ng.b,'w'):ab(r.ng,nd,a,b);}
    if(mx){if(v>best)best=v;if(best>a)a=best;}else{if(v<best)best=v;if(best<b)b=best;}
    if(a>=b)break;
  }
  return best;
}
// Daraja avtomatik: kunlik 5 ta o'yin hammasi robot bilan bo'lsa, dastlabki 3 tasi ketma-ket yutuq -> 4-5-o'yinda kuchli; 3 ta yutqazish -> sodda. Aks holda o'rtacha.
function botLevel(){
  const ms=Object.values(M()).filter(m=>(m.a===me||m.b===me)&&m.ts>Date.now()-DAY).sort((a,b)=>a.ts-b.ts);
  if(ms.length<3||ms.length>4||!ms.every(m=>m.a==='bot'||m.b==='bot'))return'm';
  const f=ms.slice(0,3);if(!f.every(m=>m.status==='done'))return'm';
  return f.every(m=>m.result.w==='a')?'h':f.every(m=>m.result.w==='b')?'e':'m';
}
function botTurn(){
  const id=openId,m=M()[id],g=S.games[id];
  if(botT||!m||m.b!=='bot'||m.a!==me||!g||g.over||g.t!=='b')return;
  const lv=m.lv||'m';
  botT=setTimeout(()=>{botT=null;const g=S.games[id];if(!g||g.over||g.t!=='b')return;
    if(g.missed&&g.missed.length)return chipRemove(id,g,g.missed[0]);
    const cand=moves(g);if(!cand.length)return;
    const D=lv==='h'?4:lv==='m'?2:1,noise=lv==='h'?.15:lv==='m'?.7:1.5,rnd=lv==='e'?.3:lv==='m'?.05:0;
    let best=cand[Math.random()*cand.length|0],bs=-1e9;
    if(Math.random()>=rnd)cand.forEach(([i,t])=>{
      const r=apply(g,i,t);let v;
      if(r.ev)v=r.ev.res==='b'?1e3:r.ev.res==='w'?-1e3:0;
      else{const nd=r.ng.t==='b'?D:D-1;v=nd<=0?val(r.ng.b,'b')-val(r.ng.b,'w'):ab(r.ng,nd,-1e9,1e9);}
      v+=Math.random()*noise;if(v>bs){bs=v;best=[i,t];}});
    play(id,g,best[0],best[1]);},700);
}
/* ====== TAKLIFLAR ====== */
const need=()=>me?false:(alert("Avval tepadagi «Men» ro'yxatidan ismingizni tanlang"),true);
function invite(to){
  if(need())return;const l=limitMsg(me)||limitMsg(to);if(l)return alert(l);
  DB.update({['invites/i'+Date.now()]:{from:me,to,ts:Date.now(),st:'p'}});alert(nm(to)+" ga taklif yuborildi. Javobni kuting.");
}
function answer(iid,ok){
  const v=S.invites[iid];if(!v)return;
  if(!ok)return DB.update({['invites/'+iid+'/st']:'d'});
  const l=limitMsg(me)||limitMsg(v.from);if(l)return alert(l);
  const mid='m'+Date.now();
  DB.update({['league/matches/'+mid]:{a:v.from,b:me,status:'play',ts:Date.now()},['games/'+mid]:newGame(),['invites/'+iid+'/st']:'a',['invites/'+iid+'/mid']:mid});
  setTimeout(()=>openM(mid),0);
}
function vsBot(){
  if(need())return;const l=limitMsg(me);if(l)return alert(l);
  const mid='m'+Date.now();
  DB.update({['league/matches/'+mid]:{a:me,b:'bot',status:'play',ts:Date.now(),lv:botLevel()},['games/'+mid]:newGame()});setTimeout(()=>openM(mid),0);
}
/* ====== ADMIN: IMPORT ====== */
function addPeople(rows){
  const have=new Set(Object.values(P()).map(x=>x.toLowerCase())),patch={},t=Date.now().toString(36);let n=0;
  rows.forEach(([c,f],k)=>{
    c=String(c||'').trim();f=String(f||'').trim().replace(/\s+/g,' ');if(!f)return;
    if(/^(sinf|ism)/i.test(c)&&/ism|familya/i.test(f))return; // sarlavha qatori
    f=f.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());
    if(c&&!/sinf/i.test(c))c+='-sinf';
    const label=c?f+', '+c:f;if(have.has(label.toLowerCase()))return;have.add(label.toLowerCase());
    patch['league/participants/p'+t+'_'+k]=label;n++;});
  if(n){isAdmin=true;localStorage.setItem('shashka_admin','1');DB.update(patch);}
  alert(n+" ta ishtirokchi qo'shildi");
}
async function importXlsx(file){
  if(!file)return;if(typeof XLSX==='undefined')return alert("Excel kutubxonasi yuklanmadi (internetni tekshiring)");
  const wb=XLSX.read(await file.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  addPeople(rows.map(r=>[r[0],r[1]]));$('xl').value='';
}
function addManual(){
  addPeople($('names').value.split('\n').filter(x=>x.trim()).map(l=>{const k=l.lastIndexOf(',');return k<0?['',l]:[l.slice(k+1),l.slice(0,k)];}));$('names').value='';
}
function clearResults(){if(confirm("Barcha natijalar va o'yinlar o'chadi (ishtirokchilar qoladi). Davom etasizmi?")){DB.update({'league/matches':null,games:null,invites:null});openId=null;}}
function resetAll(){if(confirm("Ishtirokchilar va natijalar butunlay o'chadi!")){DB.update({league:null,games:null,invites:null,presence:null});openId=null;}}
/* ====== JADVAL ====== */
function standings(){
  const st={};Object.keys(P()).forEach(id=>st[id]={id,o:0,g:0,d:0,m:0,pts:0,diff:0});
  const u=(x,r,own,opp)=>{const s=st[x];if(!s)return;s.o++;if(r==='d'){s.d++;s.pts++;}else if(r==='w'){s.g++;s.pts+=3;s.diff+=own;}else{s.m++;s.diff-=opp;}};
  Object.values(M()).forEach(m=>{if(m.status!=='done')return;const r=m.result;
    if(r.w==='d'){u(m.a,'d');u(m.b,'d');}
    else if(r.w==='a'){u(m.a,'w',r.pa,0);u(m.b,'l',0,r.pa);}
    else{u(m.b,'w',r.pb,0);u(m.a,'l',0,r.pb);}});
  return Object.values(st).sort((x,y)=>y.pts-x.pts||y.diff-x.diff||nm(x.id).localeCompare(nm(y.id)));
}
function resText(m){const r=m.result;if(!r)return'';return r.w==='d'?"Durrang (1:1)":nm(r.w==='a'?m.a:m.b)+" yutdi (+"+(r.w==='a'?r.pa:r.pb)+" tosh)";}
/* ====== INTERFEYS ====== */
function renderLeft(){
  let h='';const now=Date.now();
  Object.entries(S.invites).forEach(([iid,v])=>{
    if(v.to===me&&v.st==='p'&&now-v.ts<INV_TTL)h+=`<div class="card" style="background:#2f7d4f;text-align:center"><b>${nm(v.from)}</b> sizni o'yinga taklif qildi<div class="row" style="justify-content:center"><button onclick="answer('${iid}',1)">Qabul qilish</button><button class="r" onclick="answer('${iid}',0)">Rad etish</button></div></div>`;
    if(v.from===me&&now-v.ts<INV_TTL+6e4&&!seen.has(iid+v.st)){
      if(v.st==='a'){seen.add(iid+v.st);setTimeout(()=>openM(v.mid),0);}
      else if(v.st==='d'){seen.add(iid+v.st);setTimeout(()=>alert(nm(v.to)+" taklifni rad etdi"),50);}}
  });
  if(!me)h+='<div class="card" style="background:#5c4a12">Tepadagi «Men» ro\'yxatidan ismingizni tanlang.</div>';
  else{
    const u=used(me),act=Object.entries(M()).filter(([,m])=>m.status==='play'&&(m.a===me||m.b===me));
    h+=`<div class="card"><h3>${nm(me)}</h3><p>Bugun: <b>${u.length}/${LIM}</b> o'yin${u.length>=LIM?" — keyingisi "+fmt(u[u.length-LIM]+DAY)+" dan keyin":""}</p><button class="p" onclick="vsBot()">🤖 Robot bilan o'ynash</button>`;
    act.forEach(([id,m])=>h+=`<div class="m"><span>${nm(m.a===me?m.b:m.a)}<br><small>o'ynalmoqda</small></span><button onclick="openM('${id}')">Davom etish</button></div>`);
    h+='</div>';
    const busy=new Set();Object.values(M()).forEach(m=>{if(m.status==='play'){busy.add(m.a);busy.add(m.b);}});
    const on=Object.entries(S.presence).filter(([id,t])=>id!==me&&P()[id]&&now-t<ONLINE);
    h+=`<div class="card"><h3>Onlayn (${on.length})</h3>`+(on.length?on.map(([id])=>`<div class="m"><span class="on-d">● <span style="color:#e8ecf3">${nm(id)}</span>${busy.has(id)?" <small>(o'ynayapti)</small>":""}</span><button ${busy.has(id)?'disabled':''} onclick="invite('${id}')">O'ynash</button></div>`).join(''):'<small>Hozircha boshqa ishtirokchi yo\'q</small>')+'</div>';
  }
  const st=standings();
  if(!st.length){h+='<div class="card">Hali ishtirokchilar qo\'shilmagan. Admin Excel faylni yuklashi kerak.</div>';$('left').innerHTML=h;return;}
  h+=`<div class="card"><h3>Umumiy jadval (${st.length})</h3><div class="scroll"><table><tr><th>#</th><th>Ishtirokchi</th><th>O</th><th>G</th><th>D</th><th>M</th><th>Ochko</th><th>Tosh</th></tr>`;
  st.forEach((s,k)=>{const f=k===0&&s.o>0;h+=`<tr class="${f?'first':k<5&&s.o?'q':''} ${s.id===me?'me':''}"><td>${k+1}</td><td>${f?'<span class="lead">'+nm(s.id)+'</span><span class="tr"></span>':nm(s.id)}</td><td>${s.o}</td><td>${s.g}</td><td>${s.d}</td><td>${s.m}</td><td><b>${s.pts}</b></td><td>${s.diff>0?'+':''}${s.diff}</td></tr>`;});
  h+='</table></div></div>';
  const rec=Object.entries(M()).filter(([,m])=>m.status==='done').sort((a,b)=>b[1].ts-a[1].ts).slice(0,8);
  if(rec.length)h+='<div class="card"><h3>So\'nggi o\'yinlar</h3>'+rec.map(([id,m])=>`<div class="m"><span>${nm(m.a)} — ${nm(m.b)}<br><small>${resText(m)}</small></span><button onclick="openM('${id}')">Ko'rish</button></div>`).join('')+'</div>';
  $('left').innerHTML=h;
}
function renderRight(){
  const m=openId&&M()[openId],g=m&&S.games[openId];
  if(!m||!g){$('right').innerHTML='<div class="card">O\'yinni tanlang yoki «O\'ynash» tugmasini bosing.</div>';return;}
  const side=mySide(m);let h='<div class="card">';
  if(g.t!==side||g.over){sel=null;chipMode=false;}
  const flip=side==='b',top=flip?{n:m.a,s:'w'}:{n:m.b,s:'b'},bot=flip?{n:m.b,s:'b'}:{n:m.a,s:'w'};
  const pl=o=>`<div class="pl ${!g.over&&g.t===o.s?'on':''}">${o.s==='w'?'⚪':'⚫'} ${nm(o.n)} <small>(${mine(g.b,o.s).length} tosh)</small></div>`;
  h+=pl(top);
  const T=sel!=null?new Set(targets(g,sel).map(t=>t.to)):new Set(),tk=new Set(g.taken||[]),ms=new Set(g.missed||[]);
  h+='<div class="board">';
  for(let k=0;k<64;k++){const i=flip?63-k:k,r=i>>3,c=i&7,p=g.b[i];
    let cls='sq '+(isDark(r,c)?'d':'l');
    if(i===sel)cls+=' sel';if(T.has(i))cls+=' tg';if(g.last&&(g.last[0]===i||g.last[1]===i))cls+=' lm';if(chipMode&&ms.has(i))cls+=' ms';
    h+=`<div class="${cls}" data-i="${i}">${p!=='.'?`<div class="pc ${p.toLowerCase()} ${p!==p.toLowerCase()?'k':''} ${tk.has(i)?'tk':''}"></div>`:''}</div>`;}
  h+='</div>'+pl(bot);
  if(g.over)h+=`<div class="warn" style="background:#24533a">${resText(m)||'Tugadi'}</div>`;
  else{
    h+=`<p style="text-align:center">Navbat: <b>${nm(g.t==='w'?m.a:m.b)}</b>${g.t===side?" — sizning yurishingiz":""}${g.chain>=0&&g.t===side?"<br>Urishni davom ettiring!":""}</p>`;
    if(g.missed&&g.missed.length&&g.t===side)h+=`<div class="warn">Raqib urishni o'tkazib yubordi! <button class="r" onclick="doChip()">Chippaki!</button></div>`;
    h+=side?`<div class="row" style="justify-content:center"><button onclick="resign()">Taslim bo'lish</button></div>`:'<p style="text-align:center;color:#9fb0d0">Siz tomoshabinsiz</p>';
  }
  $('right').innerHTML=h+'</div>';
}
function render(){
  if(AUTH){const pid=user&&S.links[user.uid];me=(pid&&P()[pid])?pid:'';}
  $('gate').style.display=(AUTH&&authReady&&!user)?'flex':'none';
  $('usr').textContent=user?user.email:'';$('out').style.display=user?'':'none';
  $('admin').style.display=(isAdmin||!Object.keys(P()).length)?'block':'none';
  const ps=P(),key=JSON.stringify(ps);
  if(ps[me])selCls=clsOf(ps[me]);
  if(key+'|'+selCls!==lastP){lastP=key+'|'+selCls;
    const cl=[...new Set(Object.values(ps).map(clsOf))].sort((a,b)=>a.localeCompare(b,'uz',{numeric:true}));
    $('cls').innerHTML='<option value="">— sinf —</option>'+cl.map(c=>`<option>${c}</option>`).join('');
    $('me').innerHTML='<option value="">— ism familya —</option>'+Object.entries(ps).filter(([,l])=>clsOf(l)===selCls).sort((a,b)=>nameOf(a[1]).localeCompare(nameOf(b[1]))).map(([id,l])=>`<option value="${id}">${nameOf(l)}</option>`).join('');
  }
  $('cls').value=selCls;$('me').value=ps[me]?me:'';
  renderLeft();renderRight();botTurn();
}
function openM(id){openId=id;sel=null;chipMode=false;render();}
function doChip(){const g=S.games[openId];if(g.missed.length===1)chippaki(g.missed[0]);else{chipMode=true;render();}}
$('right').addEventListener('click',e=>{
  const q=e.target.closest('.sq');if(!q)return;const i=+q.dataset.i,g=S.games[openId],m=M()[openId];
  if(!g||g.over)return;const side=mySide(m);if(!side||g.t!==side)return;
  if(chipMode){if((g.missed||[]).includes(i))chippaki(i);return;}
  if(sel!=null){const t=targets(g,sel).find(t=>t.to===i);if(t){const f=sel;sel=null;play(openId,g,f,t);return;}}
  const ch=g.chain==null?-1:g.chain;
  sel=(g.b[i]!=='.'&&g.b[i].toLowerCase()===side&&(ch<0||ch===i))?i:null;render();
});
const clsOf=l=>{const k=l.lastIndexOf(', ');return k<0?'—':l.slice(k+2);};
const nameOf=l=>{const k=l.lastIndexOf(', ');return k<0?l:l.slice(0,k);};
$('cls').onchange=e=>{
  if(AUTH&&me&&e.target.value!==clsOf(P()[me])){alert("Siz allaqachon «"+nm(me)+"» ism-familyangiz bo'yicha ulangansiz. Boshqa ishtirokchi nomidan qatnasha olmaysiz.");return render();}
  selCls=e.target.value;lastP='';render();};
function chooseMe(id){
  if(!AUTH){me=id;localStorage.setItem('shashka_me',me);beat();render();return;}
  if(!user||!id)return render();
  const l=S.links[user.uid],linked=(l&&P()[l])?l:'',dev=localStorage.getItem('shashka_dev');
  if(linked&&id!==linked){alert("Siz allaqachon «"+nm(linked)+"» ism-familyangiz bo'yicha ulangansiz. Boshqa ishtirokchi nomidan qatnasha olmaysiz.");return render();}
  if(!linked&&dev&&P()[dev]&&id!==dev){alert("Bu qurilmadan allaqachon «"+nm(dev)+"» nomi bilan ulanilgan. Boshqa ishtirokchi nomidan qatnasha olmaysiz.");return render();}
  const o=S.owners[id];if(o&&o.uid!==user.uid){alert("Bu ishtirokchi boshqa hisob (email) bilan ulangan. Boshqa ishtirokchi nomidan qatnasha olmaysiz.");return render();}
  if(linked===id)return render();
  if(!confirm("«"+nm(id)+"» nomi "+user.email+" hisobiga ulanadi va keyin o'zgartirib bo'lmaydi. Tasdiqlaysizmi?"))return render();
  localStorage.setItem('shashka_dev',id);
  DB.update({['links/'+user.uid]:id,['owners/'+id]:{uid:user.uid}});
}
$('me').onchange=e=>chooseMe(e.target.value);
$('gbtn').onclick=()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});firebase.auth().signInWithPopup(p).catch(e=>alert("Kirish bajarilmadi: "+e.message));};
$('out').onclick=()=>firebase.auth().signOut();
function clearLinks(){if(confirm("Barcha ism-email bog'lanishlari o'chadi. Davom etasizmi?")){localStorage.removeItem('shashka_dev');DB.update({links:null,owners:null});}}
$('xl').onchange=e=>importXlsx(e.target.files[0]);
$('adm').onclick=()=>{if(isAdmin){isAdmin=false;localStorage.removeItem('shashka_admin');}else if(prompt("Admin paroli:")===ADMIN_PASS){isAdmin=true;localStorage.setItem('shashka_admin','1');}render();};
function beat(){if(me&&P()[me])DB.update({['presence/'+me]:Date.now()});}
setInterval(beat,25000);setTimeout(beat,1500);
render();
</script></body></html>
